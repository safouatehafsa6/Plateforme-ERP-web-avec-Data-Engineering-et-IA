services:
  postgres-erp:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - ./secrets/postgres/server.crt:/var/lib/postgresql/server.crt:ro
      - ./secrets/postgres/server.key:/var/lib/postgresql/server.key:ro

  backend:
    environment:
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/postgres-tls/ca.crt
    volumes:
      - ./secrets/postgres/ca.crt:/run/postgres-tls/ca.crt:ro
